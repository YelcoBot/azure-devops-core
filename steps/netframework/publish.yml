parameters:
  - name: projects
    type: object
    default: []

steps:
  - ${{ each project in parameters.projects }}:
    - ${{ if eq(project.type, 'WEB') }}:
      - task: MSBuild@1
        displayName: '📤 Publish Web - ${{ project.name }}'
        inputs:
          solution: '${{ project.projectPattern }}'
          msbuildArchitecture: 'x64'
          configuration: '$(buildConfiguration)'
          platform: '$(buildPlatform)'
          msbuildArguments: >
            /t:Build;_CopyWebApplication
            /p:OutDir="$(Agent.TempDirectory)/TempBuild"
            /p:OutputPath="$(Agent.TempDirectory)/TempBuild"
            /p:WebProjectOutputDir="$(Build.ArtifactStagingDirectory)/${{ project.outputPath }}"
            /p:OverwriteReadOnlyFiles=true

    - ${{ if eq(project.type, 'VSIX') }}:
      - task: MSBuild@1
        displayName: '🧩 Build VSIX - ${{ project.name }}'
        inputs:
          solution: '${{ project.projectPattern }}'
          msbuildArchitecture: 'x64'
          configuration: '$(buildConfiguration)'
          platform: '$(buildPlatform)'
          msbuildArguments: >
            /t:Build
            /p:OutDir="$(Agent.TempDirectory)/TempBuild/${{ project.name }}/"
            /p:OverwriteReadOnlyFiles=true

      - task: CopyFiles@2
        displayName: '📦 Copy VSIX - ${{ project.name }}'
        inputs:
          SourceFolder: '$(Agent.TempDirectory)/TempBuild/${{ project.name }}'
          Contents: |
            *.vsix
            publishManifest.json
            overview.md
          TargetFolder: '$(Build.ArtifactStagingDirectory)/${{ project.outputPath }}'

    - ${{ if in(project.type, 'APP', 'CLI') }}:
      - task: MSBuild@1
        displayName: '📦 Build ${{ project.type }} - ${{ project.name }}'
        inputs:
          solution: '${{ project.projectPattern }}'
          msbuildArchitecture: 'x64'
          configuration: '$(buildConfiguration)'
          platform: '$(buildPlatform)'
          msbuildArguments: >
            /t:Build
            /p:OutDir="$(Build.ArtifactStagingDirectory)/${{ project.outputPath }}"
            /p:OutputPath="$(Build.ArtifactStagingDirectory)/${{ project.outputPath }}"
            /p:OverwriteReadOnlyFiles=true

    - ${{ if eq(project.type, 'NUGET') }}:
      - task: NuGetCommand@2
        displayName: '🎁 Pack NuGet - ${{ project.name }}'
        inputs:
          command: 'pack'
          packagesToPack: '${{ project.projectPattern }}'
          configuration: '$(buildConfiguration)'
          packDestination: '$(Build.ArtifactStagingDirectory)/${{ project.outputPath }}'
