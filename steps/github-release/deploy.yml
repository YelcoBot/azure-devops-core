parameters:
  - name: projects
    type: object
    default: []

  - name: tagName
    type: string
    default: 'v$(GitVersionInfo.MajorMinorPatch)'

steps:
  - ${{ each project in parameters.projects }}:
    - task: CopyFiles@2
      displayName: '📦 Copy release assets - ${{ project.name }}'
      inputs:
        SourceFolder: '$(Pipeline.Workspace)/${{ project.outputPath }}'
        ${{ if eq(project.type, 'VSIX') }}:
          Contents: '*.vsix'
        ${{ else }}:
          Contents: '*'
        TargetFolder: '$(Build.ArtifactStagingDirectory)/release'

  - task: GitHubRelease@1
    displayName: '🚀 Create GitHub Release - ${{ parameters.tagName }}'
    inputs:
      gitHubConnection: '$(gitHubConnection)'
      repositoryName: '$(Build.Repository.Name)'
      action: 'create'
      target: '$(Build.SourceVersion)'
      tagSource: 'userSpecifiedTag'
      tag: '${{ parameters.tagName }}'
      title: '${{ parameters.tagName }}'
      assets: '$(Build.ArtifactStagingDirectory)/release/*'
      isDraft: false
      isPreRelease: false
      addChangeLog: true
      changeLogCompareToRelease: 'lastFullRelease'
      changeLogType: 'commitBased'
