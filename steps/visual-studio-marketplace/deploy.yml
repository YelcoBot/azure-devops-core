parameters:
  - name: projects
    type: object
    default: []

steps:
  - ${{ each project in parameters.projects }}:
    - ${{ if eq(project.type, 'VSIX') }}:
      - task: PublishVisualStudioExtension@5
        displayName: '🚀 Deploy VSIX - ${{ project.name }}'
        inputs:
          connectTo: 'VsTeam'
          connectedServiceName: 'visual-studio-marketplace'
          vsixFile: '$(Pipeline.Workspace)/${{ project.outputPath }}/${{ project.vsixFile }}'
          manifestFile: '$(Pipeline.Workspace)/${{ project.outputPath }}/publishManifest.json'
          publisherId: '${{ project.publisherId }}'
