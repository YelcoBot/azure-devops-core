parameters:
  - name: service
    type: string

  - name: command
    type: string

  - name: language
    type: string
    values:
      - dotnet
      - netframework

  - name: projects
    type: object
    default: []

  - name: artifacts
    type: object
    default: []

  - name: dependsOn
    type: object
    default: ''

stages:
  - stage: ${{ replace(parameters.service, '-', '_') }}_${{ parameters.command }}_build_publish
    ${{ if ne(parameters.dependsOn, '') }}:
      dependsOn: ${{ parameters.dependsOn }}
    displayName: '🛠️ Build and Publish'
    jobs:
      - template: ../../../jobs/build-publish.yml
        parameters:
          language: ${{ parameters.language }}
          projects: ${{ parameters.projects }}
          artifacts: ${{ parameters.artifacts }}