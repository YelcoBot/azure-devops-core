parameters:
  - name: service
    type: string

  - name: language
    type: string
    values:
      - dotnet
      - netframework

  - name: command
    type: string
    values:
      - deploy

  - name: projects
    type: object
    default: []

  - name: artifacts
    type: object
    default: []

  - name: dependsOn
    type: object
    default: ''

stages:
  - template: commands/${{ parameters.command }}.yml
    parameters:
      service: ${{ parameters.service }}
      language: ${{ parameters.language }}
      command: ${{ parameters.command }}
      dependsOn: ${{ parameters.dependsOn }}
      projects: ${{ parameters.projects }}
      artifacts: ${{ parameters.artifacts }}
