parameters:
  - name: language
    type: string
    values:
      - dotnet
      - netframework

  - name: projects
    type: object
    default: []

  - name: artifacts
    type: object
    default: []

jobs:
  - job: build_publish
    displayName: '⚙️ Build and Publish'
    steps:
      - template: ../steps/${{ parameters.language }}/build.yml

      - template: ../steps/${{ parameters.language }}/publish.yml
        parameters:
          projects: ${{ parameters.projects }}

      - template: ../steps/artifact/upload.yml
        parameters:
          artifacts: ${{ parameters.artifacts }}
